<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Control de Acceso ANEIB</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 30px;
    }

    #lectorQR {
      width: 100%;
      max-width: 500px;
      margin: 30px auto;
    }

    #resultado {
      margin-top: 20px;
      padding: 30px;
      font-size: 28px;
      font-weight: bold;
      border-radius: 15px;
      word-break: break-word;
    }

    .esperando {
      background: #eee;
    }

    .verde {
      background: #28a745;
      color: white;
    }

    .rojo {
      background: #dc3545;
      color: white;
    }

    #contador {
      font-size: 22px;
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <h1>Control de Acceso ANEIB</h1>

  <div id="contador">
    Ingresos: 0
  </div>

  <div id="lectorQR"></div>

  <div id="resultado" class="esperando">
    Esperando QR...
  </div>


  <script>

    const API_URL =
      "https://script.google.com/macros/s/AKfycbz9ReIHszmHMsyjp1CkG98saWZ8tw6NqNsvsVY2gxaEXnJHbBNi9YTBX9dIW4zY7MvdjQ/exec";


    let procesando = false;


    function mostrarResultado(tipo, mensaje) {

      const resultado =
        document.getElementById("resultado");

      resultado.className = tipo;

      resultado.textContent = mensaje;

    }


    async function actualizarContador() {

      try {

        const respuesta = await fetch(
          API_URL + "?accion=contador"
        );

        const datos = await respuesta.json();

        if (datos.exito) {

          document.getElementById("contador").textContent =
            "Ingresos: " + datos.contador;

        }

      } catch (error) {

        console.error(
          "Error obteniendo contador:",
          error
        );

      }

    }


    async function procesarQR(id) {

      if (procesando) {
        return;
      }

      procesando = true;


      try {

        mostrarResultado(
          "esperando",
          "Comprobando entrada..."
        );


        // Primero buscamos la entrada
        const respuestaBusqueda = await fetch(
          API_URL +
          "?accion=buscar&id=" +
          encodeURIComponent(id)
        );


        const datosBusqueda =
          await respuestaBusqueda.json();


        // ID inexistente
        if (!datosBusqueda.encontrada) {

          mostrarResultado(
            "rojo",
            "❌ ENTRADA NO VÁLIDA"
          );

          return;
        }


        const entrada =
          datosBusqueda.entrada;


        // Ya utilizada
        if (
          String(entrada.estado)
            .trim()
            .toUpperCase() === "INGRESADO"
        ) {

          mostrarResultado(
            "rojo",
            "❌ ENTRADA YA UTILIZADA\n" +
            entrada.nombre
          );

          return;
        }


        // Registrar ingreso
        const respuestaRegistro = await fetch(
          API_URL +
          "?accion=registrar&id=" +
          encodeURIComponent(id) +
          "&usuario=WEB"
        );


        const datosRegistro =
          await respuestaRegistro.json();


        // Registro correcto
        if (
          datosRegistro.exito &&
          datosRegistro.tipo === "INGRESADO"
        ) {

          mostrarResultado(
            "verde",
            "✓ INGRESO REGISTRADO\n" +
            entrada.nombre
          );


          // Actualizar contador
          await actualizarContador();


          return;
        }


        // Por seguridad, manejar carrera entre dispositivos
        if (
          datosRegistro.tipo === "YA_INGRESADO"
        ) {

          mostrarResultado(
            "rojo",
            "❌ ENTRADA YA UTILIZADA\n" +
            entrada.nombre
          );

          return;
        }


        mostrarResultado(
          "rojo",
          "❌ NO SE PUDO REGISTRAR"
        );


      } catch (error) {

        console.error(error);

        mostrarResultado(
          "rojo",
          "❌ ERROR DE CONEXIÓN"
        );


      } finally {

        // Esperar antes de permitir otro escaneo
        setTimeout(function() {

          procesando = false;

          mostrarResultado(
            "esperando",
            "Esperando QR..."
          );

        }, 3000);

      }

    }


    function qrDetectado(texto) {

      console.log(
        "QR detectado:",
        texto
      );

      procesarQR(texto);

    }


    const scanner =
      new Html5Qrcode("lectorQR");


    scanner.start(
      {
        facingMode: "environment"
      },
      {
        fps: 10,

        qrbox: {
          width: 250,
          height: 250
        }
      },

      qrDetectado,

      function(error) {
        // Errores normales mientras busca QR
      }

    )
    .catch(function(error) {

      mostrarResultado(
        "rojo",
        "❌ NO SE PUDO ACCEDER A LA CÁMARA"
      );

      console.error(error);

    });


    // Cargar contador al abrir
    actualizarContador();

  </script>

</body>
</html>
