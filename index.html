```html
<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Control de Acceso ANEIB</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f5f7;
      color: #111;
    }

    header {
      background: #111;
      color: white;
      padding: 18px 20px;
      text-align: center;
    }

    header img {
      display: block;
      max-width: 220px;
      max-height: 80px;
      width: auto;
      height: auto;
      margin: 0 auto;
      object-fit: contain;
    }

    .contenedor {
      width: 100%;
      max-width: 900px;
      margin: auto;
      padding: 25px;
    }

    .contador {
      background: white;
      border-radius: 15px;
      padding: 25px;
      text-align: center;
      margin-bottom: 20px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .contadorNumero {
      font-size: 55px;
      font-weight: bold;
    }

    .contadorTexto {
      font-size: 18px;
      color: #666;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 15px 20px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .botonEscanear {
      width: 100%;
      background: #111;
      color: white;
      margin-bottom: 20px;
    }

    .botonCerrar {
      width: 100%;
      background: #ddd;
      margin-top: 15px;
    }

    .panel {
      background: white;
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .panel h2 {
      margin-top: 0;
    }

    #lectorQR {
      width: 100%;
      max-width: 500px;
      margin: auto;
    }

    #resultado {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-align: center;
      padding: 30px;
    }

    #resultado.verde {
      display: flex;
      background: #20a957;
      color: white;
    }

    #resultado.rojo {
      display: flex;
      background: #d62828;
      color: white;
    }

    #resultado .icono {
      font-size: 90px;
      margin-bottom: 20px;
    }

    #resultado .mensaje {
      font-size: 35px;
      font-weight: bold;
      white-space: pre-line;
    }

    #resultado button {
      margin-top: 35px;
      background: white;
      color: #111;
    }

    #busqueda {
      width: 100%;
      padding: 15px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 17px;
      margin-bottom: 15px;
    }

    .persona {
      border-top: 1px solid #ddd;
      padding: 15px 0;
    }

    .personaNombre {
      font-weight: bold;
      font-size: 19px;
    }

    .personaDatos {
      color: #666;
      margin: 5px 0;
    }

    .estado {
      font-weight: bold;
      margin: 10px 0;
    }

    .estado.ingresado {
      color: #159447;
    }

    .estado.pendiente {
      color: #d28b00;
    }

    .botonDeshacer {
      background: #ddd;
      font-size: 14px;
      padding: 10px 15px;
    }

    .ultimo {
      background: #f0f0f0;
      border-radius: 10px;

    }

    .oculto {
      display: none;
    }

  </style>

</head>


<body>

  <header>

    <img
      src="LOGO.png"
      alt="Logo ANEIB"
    >

  </header>


  <div class="contenedor">

    <div class="contador">

      <div
        id="contador"
        class="contadorNumero"
      >
        0
      </div>

      <div class="contadorTexto">
        personas ingresadas
      </div>

    </div>


    <button
      class="botonEscanear"
      onclick="abrirScanner()"
    >
      ESCANEAR QR
    </button>


    <div class="panel">

      <h2>Último ingreso</h2>

      <div
        id="ultimoIngreso"
        class="ultimo"
      >
        Todavía no hay ingresos registrados.
      </div>

    </div>


    <div class="panel">

      <h2>Buscar persona</h2>

      <input
        id="busqueda"
        type="text"
        placeholder="Nombre, correo o ID..."
        oninput="buscarPersonas()"
      >

      <div id="resultados"></div>

    </div>

  </div>


  <!-- SCANNER -->

  <div
    id="panelScanner"
    class="oculto"
    style="
      position:fixed;
      inset:0;
      z-index:900;
      background:white;
      padding:20px;
      overflow:auto;
    "
  >

    <h2>Escanear QR</h2>

    <div id="lectorQR"></div>

    <button
      class="botonCerrar"
      onclick="cerrarScanner()"
    >
      CERRAR ESCÁNER
    </button>

  </div>


  <!-- RESULTADO -->

  <div id="resultado">

    <div
      id="resultadoIcono"
      class="icono"
    ></div>

    <div
      id="resultadoMensaje"
      class="mensaje"
    ></div>

    <button onclick="cerrarResultado()">
      CONTINUAR
    </button>

  </div>


  <script>

    const API_URL =
      "https://script.google.com/macros/s/AKfycbzg1JIAmrhQLwXWDEAuioTNv0zSJz3TMWrc-fQDXRF16nhkCJ7BZCg4Mw6G6wOV3oRUZw/exec";


    let scanner = null;

    let scannerActivo = false;

    let procesando = false;


    async function api(accion, parametros = {}) {

      let url =
        API_URL +
        "?accion=" +
        encodeURIComponent(accion);


      for (const clave in parametros) {

        url +=
          "&" +
          encodeURIComponent(clave) +
          "=" +
          encodeURIComponent(parametros[clave]);

      }


      const respuesta =
        await fetch(url);

      return await respuesta.json();

    }


    async function actualizarContador() {

      try {

        const datos =
          await api("contador");

        if (datos.exito) {

          document.getElementById(
            "contador"
          ).textContent = datos.contador;

        }

      } catch (error) {

        console.error(error);

      }

    }


    function abrirScanner() {

      document
        .getElementById("panelScanner")
        .classList.remove("oculto");


      if (scannerActivo) {
        return;
      }


      scanner =
        new Html5Qrcode("lectorQR");


      scanner.start(

        {
          facingMode: "environment"
        },

        {
          fps: 10,

          qrbox: {
            width: 250,
            height: 250
          }

        },

        qrDetectado,

        function(error) {}

      )
      .then(function() {

        scannerActivo = true;

      })
      .catch(function(error) {

        alert(
          "No se pudo acceder a la cámara."
        );

        console.error(error);

        cerrarScanner();

      });

    }


    async function cerrarScanner() {

      if (
        scanner &&
        scannerActivo
      ) {

        try {

          await scanner.stop();

          await scanner.clear();

        } catch (error) {

          console.error(error);

        }

      }


      scannerActivo = false;

      scanner = null;


      document
        .getElementById("panelScanner")
        .classList.add("oculto");

    }


    async function qrDetectado(texto) {

      if (procesando) {
        return;
      }

      procesando = true;


      await cerrarScanner();


      try {

        const busqueda =
          await api(
            "buscar",
            {
              id: texto
            }
          );


        if (!busqueda.encontrada) {

          mostrarResultado(
            false,
            "ENTRADA NO VÁLIDA",
            ""
          );

          return;

        }


        const entrada =
          busqueda.entrada;


        if (
          String(entrada.estado)
            .trim()
            .toUpperCase() ===
          "INGRESADO"
        ) {

          mostrarResultado(
            false,
            "ENTRADA YA UTILIZADA",
            entrada.nombre
          );

          return;

        }


        const registro =
          await api(
            "registrar",
            {
              id: texto,
              usuario: "WEB"
            }
          );


        if (
          registro.exito &&
          registro.tipo ===
          "INGRESADO"
        ) {

          mostrarResultado(
            true,
            "INGRESO REGISTRADO",
            entrada.nombre
          );


          document.getElementById(
            "ultimoIngreso"
          ).innerHTML =
            "<strong>" +
            entrada.nombre +
            "</strong><br>" +
            "ID: " +
            entrada.id;


          actualizarContador();

          return;

        }


        if (
          registro.tipo ===
          "YA_INGRESADO"
        ) {

          mostrarResultado(
            false,
            "ENTRADA YA UTILIZADA",
            entrada.nombre
          );

          return;

        }


        mostrarResultado(
          false,
          "NO SE PUDO REGISTRAR",
          ""
        );


      } catch (error) {

        console.error(error);

        mostrarResultado(
          false,
          "ERROR DE CONEXIÓN",
          ""
        );

      }

    }


    function mostrarResultado(
      correcto,
      titulo,
      nombre
    ) {

      const resultado =
        document.getElementById(
          "resultado"
        );

      const icono =
        document.getElementById(
          "resultadoIcono"
        );

      const mensaje =
        document.getElementById(
          "resultadoMensaje"
        );


      resultado.className =
        correcto
          ? "verde"
          : "rojo";


      icono.textContent =
        correcto
          ? "✓"
          : "✕";


      mensaje.textContent =
        titulo +
        (
          nombre
            ? "\n\n" + nombre
            : ""
        );

    }


    function cerrarResultado() {

      document
        .getElementById("resultado")
        .className = "";


      procesando = false;

    }


    async function buscarPersonas() {

      const termino =
        document
          .getElementById("busqueda")
          .value
          .trim();


      const contenedor =
        document.getElementById(
          "resultados"
        );


      if (!termino) {

        contenedor.innerHTML = "";

        return;

      }


      try {

        const datos =
          await api(
            "personas",
            {
              termino: termino
            }
          );


        contenedor.innerHTML = "";


        if (
          !datos.resultados ||
          datos.resultados.length === 0
        ) {

          contenedor.innerHTML =
            "<p>No se encontraron personas.</p>";

          return;

        }


        datos.resultados.forEach(
          function(persona) {

            const div =
              document.createElement("div");

            div.className =
              "persona";


            const estado =
              String(persona.estado)
                .trim()
                .toUpperCase();


            const estaIngresado =
              estado === "INGRESADO";


            div.innerHTML = `

              <div class="personaNombre">
                ${persona.nombre}
              </div>

              <div class="personaDatos">
                ${persona.email}
              </div>

              <div class="personaDatos">
                ID: ${persona.id}
              </div>

              <div class="estado ${
                estaIngresado
                  ? "ingresado"
                  : "pendiente"
              }">

                ${
                  estaIngresado
                    ? "INGRESADO"
                    : "PENDIENTE"
                }

              </div>

              ${
                estaIngresado
                  ? `
                    <button
                      class="botonDeshacer"
                      onclick="deshacer('${persona.id}')"
                    >
                      DESHACER INGRESO
                    </button>
                  `
                  : ""
              }

            `;


            contenedor.appendChild(div);

          }
        );

      } catch (error) {

        console.error(error);

        contenedor.innerHTML =
          "<p>Error al buscar.</p>";

      }

    }


    async function deshacer(id) {

      const confirmar =
        confirm(
          "¿Seguro que quieres deshacer el ingreso de esta persona?"
        );


      if (!confirmar) {
        return;
      }


      try {

        const datos =
          await api(
            "deshacer",
            {
              id: id,
              usuario: "WEB"
            }
          );


        if (datos.exito) {

          alert(
            "Ingreso deshecho correctamente."
          );


          await actualizarContador();

          await buscarPersonas();

        } else {

          alert(
            datos.mensaje ||
            "No se pudo deshacer."
          );

        }

      } catch (error) {

        console.error(error);

        alert(
          "Error de conexión."
        );

      }

    }


    actualizarContador();

  </script>

</body>

</html>
```
