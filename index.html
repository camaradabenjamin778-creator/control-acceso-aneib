<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Control de Acceso ANEIB</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 30px;
    }

    #lectorQR {
      width: 100%;
      max-width: 500px;
      margin: 30px auto;
    }

    #resultado {
      margin-top: 20px;
      font-size: 24px;
      font-weight: bold;
      word-break: break-word;
    }
  </style>
</head>

<body>

  <h1>Control de Acceso ANEIB</h1>

  <p>Escanea un código QR.</p>

  <div id="lectorQR"></div>

  <div id="resultado">
    Esperando QR...
  </div>


  <script>

    // URL ACTUAL DE NUESTRO BACKEND
    const API_URL =
      "https://script.google.com/macros/s/AKfycbz9ReIHszmHMsyjp1CkG98saWZ8tw6NqNsvsVY2gxaEXnJHbBNi9YTBX9dIW4zY7MvdjQ/exec";


    let procesando = false;


    async function procesarQR(id) {

      if (procesando) {
        return;
      }

      procesando = true;

      const resultado = document.getElementById("resultado");

      resultado.textContent = "Comprobando entrada...";


      try {

        const url =
          API_URL +
          "?accion=buscar&id=" +
          encodeURIComponent(id);


        const respuesta = await fetch(url);

        const datos = await respuesta.json();


        if (!datos.encontrada) {

          resultado.textContent =
            "❌ ENTRADA NO VÁLIDA";

          return;
        }


        if (
          String(datos.entrada.estado)
            .trim()
            .toUpperCase() === "INGRESADO"
        ) {

          resultado.textContent =
            "❌ ENTRADA YA UTILIZADA";

          return;
        }


        // Si existe y está pendiente
        resultado.textContent =
          "✅ ENTRADA VÁLIDA — " +
          datos.entrada.nombre;


      } catch (error) {

        console.error(error);

        resultado.textContent =
          "Error al comunicarse con el servidor.";

      } finally {

        setTimeout(function() {
          procesando = false;
        }, 2000);

      }

    }


    function qrDetectado(texto) {

      console.log("QR detectado:", texto);

      procesarQR(texto);

    }


    const scanner =
      new Html5Qrcode("lectorQR");


    scanner.start(
      {
        facingMode: "environment"
      },
      {
        fps: 10,
        qrbox: {
          width: 250,
          height: 250
        }
      },
      qrDetectado,
      function(error) {
        // Ignorar errores normales de lectura
      }
    )
    .catch(function(error) {

      document.getElementById("resultado").textContent =
        "No se pudo acceder a la cámara.";

      console.error(error);

    });

  </script>

</body>
</html>
